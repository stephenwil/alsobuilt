name: Validate Variants

on:
  pull_request:
    paths:
      - 'categories.yaml'
      - 'variants/**'
      - 'schema/**'
      - '.github/ISSUE_TEMPLATE/submit-project.yml'
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:variants
      - run: npm run build
