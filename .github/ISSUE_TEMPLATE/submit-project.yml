name: Submit an Open-Source Project
description: Paste a GitHub repo URL and we'll automatically fetch live stars/license and open a catalog PR for you.
title: "[Submit]: "
labels: ["project-submission"]
body:
  - type: markdown
    attributes:
      value: |
        Want to add your indie build or an open-source project to **AlsoBuilt** without hand-editing YAML?
        Fill in the fields below — our GitHub Action will fetch live stars & metadata from GitHub and open a ready-to-merge PR automatically.

  - type: input
    id: repo
    attributes:
      label: GitHub Repository URL
      description: Public GitHub repository URL (`https://github.com/owner/repo`).
      placeholder: https://github.com/owner/my-open-source-tool
    validations:
      required: true

  - type: input
    id: display_name
    attributes:
      label: Project Display Name (optional)
      description: Human-readable project name (2–64 chars). Leave blank to use the issue title or a formatted repo name.
      placeholder: Ranger CAN Explorer

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - ai-memory
        - coding-agents
        - local-voice
        - mcp-tooling
        - local-llm-runners
        - browser-computer-use
        - agent-workflows
        - hardware-embedded
        - gamedev-retro
        - devtools-infra
        - other (suggest a new category below)
    validations:
      required: true

  - type: input
    id: new_category
    attributes:
      label: Suggested New Category (only if Category = other)
      description: "Optional new category display name (e.g. `Audio & Music Tools` or `Robotics & Drones`). If provided, the auto-PR will also propose adding this category to `categories.yaml`."
      placeholder: Audio & Music Tools

  - type: dropdown
    id: arch
    attributes:
      label: Architecture / Form Factor
      options:
        - CLI
        - Desktop
        - Web
        - SDK
        - Browser
        - Mobile
    validations:
      required: true

  - type: dropdown
    id: model
    attributes:
      label: Model Runtime
      options:
        - Standalone
        - Local LLM
        - Hybrid
        - Cloud API
    validations:
      required: true

  - type: dropdown
    id: stage
    attributes:
      label: Project Stage
      options:
        - Proto
        - Beta
        - Prod
        - Lesson
    validations:
      required: true

  - type: input
    id: tagline
    attributes:
      label: One-line Tagline (optional)
      description: Leave blank to auto-use the GitHub repository description (12–180 chars).
      placeholder: Interactive 3D CAN bus explorer or local-first fantasy console dev kit

  - type: input
    id: stack
    attributes:
      label: Primary Stack (optional)
      description: Leave blank to infer from the GitHub primary language.
      placeholder: TypeScript + Three.js + WebGL

  - type: input
    id: traits
    attributes:
      label: Traits (optional, comma-separated)
      description: "When provided, your list is used directly (plus exact language/form-factor matches). Leave blank to infer automatically. Allowed: local-first, mcp, voice, markdown, multi-agent, browser, cli, rust, python, typescript, open-weights, self-hosted, mobile, rag, realtime, hardware, gamedev, 3d-webgl, audio-synth"
      placeholder: hardware, 3d-webgl, browser, realtime

  - type: textarea
    id: lesson
    attributes:
      label: Lesson Note (only if Stage = Lesson)
      description: Optional takeaway if this project is archived, superseded, or paused (max 280 chars).
      placeholder: Showed early demand for X, though superseded by Y because...
