# Single source of truth for AlsoBuilt categories.
# To add or edit a category:
#   1. Add/update an entry below (kebab-case slug, display name, short description).
#   2. Run `npm run sync:categories` to update schema/variant.schema.json and the GitHub Issue Form.
#   3. Commit & push — GitHub Actions automatically upserts categories into Cloudflare D1 on deploy.

